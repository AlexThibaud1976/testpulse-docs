<!doctype html>
<html lang="fr">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>TP-DOC · Boutique démo</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f7f5;color:#183b38;font:17px/1.6 system-ui,sans-serif}main{max-width:900px;margin:50px auto;padding:32px}header{display:flex;align-items:center;justify-content:space-between}.tag{font-size:12px;letter-spacing:.12em;text-transform:uppercase;font-weight:700}h1{font-size:42px;line-height:1.15}h2{font-size:23px}.intro{color:#4e6864}.layout{display:grid;grid-template-columns:1fr 1fr;gap:24px}section{background:white;border:1px solid #d5e3df;border-radius:12px;padding:24px}button,input{font:inherit;border-radius:6px;padding:10px 14px}button{cursor:pointer;border:0;background:#0f766e;color:white}input{width:100%;border:1px solid #a5bcb7;margin:8px 0 18px}label{font-weight:600;display:block}.price{font-size:34px;font-weight:700}.notice{padding:16px;border-left:4px solid #bd6221;background:#fff3e7;font-size:14px}.result{margin-top:18px;padding:16px;background:#dcfce7;color:#14532d}footer{margin-top:28px;font-size:13px;color:#536a66}.secondary{background:white;color:#185c56;border:1px solid #b7ceca}@media(max-width:650px){main{padding:18px;margin:12px auto}.layout{grid-template-columns:1fr}h1{font-size:32px}}
</style></head>
<body><main>
<header><span class="tag">TP-DOC · <span data-fr="Atelier TestPulse" data-en="TestPulse workshop"></span></span><button class="secondary" id="language" aria-label="Switch language">English</button></header>
<h1 data-fr="Une boutique pour apprendre." data-en="A shop built for learning."></h1>
<p class="intro" data-fr="Un petit panier, trois cas de test et une anomalie à documenter." data-en="One small cart, three test cases and a defect to document."></p>
<p class="notice" data-fr="Démonstration fictive. Aucune commande, aucun paiement et aucun envoi de données. L’acceptation d’une adresse vide est une anomalie volontaire pour l’exercice." data-en="Fictional demonstration. No order, payment or data transmission. Accepting an empty address is an intentional defect for the exercise."></p>
<div class="layout"><section><h2 data-fr="Carnet de test" data-en="Testing notebook"></h2><p data-fr="Un article de démonstration." data-en="A demonstration item."></p><p class="price">20 EUR</p><button id="add" data-fr="Ajouter au panier" data-en="Add to cart"></button><p id="cart" aria-live="polite"></p><button class="secondary" id="reset" data-fr="Recommencer" data-en="Reset exercise"></button></section>
<section><h2 data-fr="Livraison" data-en="Delivery"></h2><label for="address" data-fr="Adresse de livraison" data-en="Delivery address"></label><input id="address" autocomplete="off"><label for="coupon" data-fr="Code promotionnel" data-en="Promotion code"></label><input id="coupon" autocomplete="off" placeholder="DEMO10"><p><span data-fr="Total" data-en="Total"></span> : <strong id="total">0 EUR</strong></p><button id="checkout" data-fr="Valider la commande" data-en="Place order"></button><div id="result" role="status" hidden></div></section></div>
<footer data-fr="Règle attendue : une adresse est obligatoire. DEMO10 applique une remise de 10 %. Cette page fonctionne hors ligne et ne conserve aucune donnée après fermeture." data-en="Expected rule: an address is required. DEMO10 applies a 10% discount. This page works offline and keeps no data after closing."></footer>
</main><script>
let lang='fr',quantity=0,ordered=false;
const byId=id=>document.getElementById(id);
function render(){document.documentElement.lang=lang;document.querySelectorAll('[data-fr]').forEach(el=>el.textContent=el.dataset[lang]);byId('language').textContent=lang==='fr'?'English':'Français';byId('cart').textContent=lang==='fr'?quantity+' article(s) dans le panier':quantity+' item(s) in cart';byId('total').textContent=(quantity*20*(byId('coupon').value.trim().toUpperCase()==='DEMO10'?0.9:1))+' EUR';byId('result').hidden=!ordered;byId('result').className='result';byId('result').textContent=lang==='fr'?'Commande de démonstration acceptée.':'Demonstration order accepted.';}
byId('add').onclick=()=>{quantity++;ordered=false;render()};byId('reset').onclick=()=>{quantity=0;ordered=false;byId('address').value='';byId('coupon').value='';render()};byId('coupon').oninput=render;byId('language').onclick=()=>{lang=lang==='fr'?'en':'fr';render()};byId('checkout').onclick=()=>{if(quantity===0){byId('result').hidden=false;byId('result').className='notice';byId('result').textContent=lang==='fr'?'Ajoutez un article au panier.':'Add an item to the cart.';return;}ordered=true;render()};render();
</script></body></html>
